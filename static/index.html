<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceBot — English → Hindi</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #ffffff;
      --surface:  #f6f8fa;
      --surface2: #eaeef2;
      --border:   #d1d5db;
      --accent:   #7c3aed;
      --accent2:  #2563eb;
      --green:    #16a34a;
      --red:      #dc2626;
      --orange:   #d97706;
      --text:     #1f2328;
      --muted:    #57606a;
      --radius:   12px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Layout ───────────────────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-rows: 56px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .logo-sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      margin-left: -6px;
    }

    .header-spacer { flex: 1; }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--orange);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .status-dot.ready { background: var(--green); animation: none; }
    .status-dot.error { background: var(--red);   animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Main grid ────────────────────────────────────────────────── */
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
    }

    /* ── Panels ───────────────────────────────────────────────────── */
    .panel {
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
      overflow-y: auto;
    }

    .panel-left  { border-right: 1px solid var(--border); }

    .panel-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Card ─────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    /* ── Textarea ─────────────────────────────────────────────────── */
    .input-area {
      width: 100%;
      min-height: 200px;
      max-height: 340px;
      resize: vertical;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      line-height: 1.7;
    }

    .input-area::placeholder { color: var(--muted); }

    /* ── Char count ───────────────────────────────────────────────── */
    .char-count {
      text-align: right;
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Button row ───────────────────────────────────────────────── */
    .btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }

    .btn-ghost {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

    .btn-mic {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      flex-shrink: 0;
      font-size: 18px;
    }
    .btn-mic.recording {
      background: var(--red);
      border-color: var(--red);
      animation: rec-pulse 1s ease-in-out infinite;
    }

    @keyframes rec-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248,81,73,.6); }
      50%       { box-shadow: 0 0 0 8px rgba(248,81,73,0); }
    }

    /* ── Output text ──────────────────────────────────────────────── */
    .hindi-output {
      font-size: 22px;
      line-height: 1.7;
      color: var(--text);
      min-height: 100px;
      font-family: "Noto Sans Devanagari", "Mangal", sans-serif;
    }

    .hindi-placeholder {
      color: var(--muted);
      font-size: 15px;
      font-family: inherit;
    }

    /* ── Audio player ─────────────────────────────────────────────── */
    audio {
      width: 100%;
      border-radius: 8px;
      outline: none;
    }

    audio::-webkit-media-controls-panel { background: var(--surface); }

    /* ── Stats bar ────────────────────────────────────────────────── */
    .stats-bar {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      padding-top: 4px;
    }

    .stat { display: flex; gap: 4px; align-items: center; }
    .stat-val { color: var(--text); font-weight: 600; }

    /* ── Error box ────────────────────────────────────────────────── */
    .error-box {
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--red);
    }

    /* ── Mic transcript ───────────────────────────────────────────── */
    .mic-transcript {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }

    /* ── Scrollbar ────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Responsive ───────────────────────────────────────────────── */
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto auto; }
      .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Header ──────────────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <div class="logo-icon">🎙</div>
      <span>VoiceBot</span>
      <span class="logo-sub">en → hi</span>
    </div>
    <div class="header-spacer"></div>
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Loading models…</span>
    </div>
  </header>

  <!-- ── Main ────────────────────────────────────────────────────── -->
  <main>

    <!-- ── Left: Input panel ─────────────────────────────────────── -->
    <div class="panel panel-left">
      <div class="panel-title">English Input</div>

      <!-- Text input -->
      <div class="card">
        <textarea
          id="inputText"
          class="input-area"
          placeholder="Type English text here, or record your voice…"
          spellcheck="true"
          autocomplete="off"
        ></textarea>
        <div class="char-count"><span id="charCount">0</span> chars</div>
      </div>

      <!-- Mic + Translate -->
      <div class="btn-row">
        <button class="btn btn-mic" id="micBtn" title="Click to record">🎤</button>
        <div id="micStatus" class="mic-transcript"></div>
        <div class="header-spacer"></div>
        <button class="btn btn-ghost" id="clearBtn">Clear</button>
        <button class="btn btn-primary" id="translateBtn">
          <span>Translate</span>
          <span>→</span>
        </button>
      </div>

    </div>

    <!-- ── Right: Output panel ───────────────────────────────────── -->
    <div class="panel panel-right">
      <div class="panel-title">Hindi Output</div>

      <!-- Hindi text -->
      <div class="card" id="hindiCard">
        <div class="hindi-output" id="hindiText">
          <span class="hindi-placeholder">Translation will appear here…</span>
        </div>
      </div>

      <!-- Audio player (hidden until audio is ready) -->
      <div class="card" id="audioCard" style="display:none">
        <div class="panel-title" style="margin-bottom:10px">Audio Playback</div>
        <audio id="audioPlayer" controls></audio>
      </div>

      <!-- Stats bar -->
      <div class="stats-bar" id="statsBar" style="display:none">
        <div class="stat">Translate: <span class="stat-val" id="statTrans">—</span></div>
        <div class="stat">TTS: <span class="stat-val" id="statTts">—</span></div>
        <div class="stat">Total: <span class="stat-val" id="statTotal">—</span></div>
      </div>

      <!-- Error display -->
      <div class="error-box" id="errorBox" style="display:none"></div>
    </div>

  </main>
</div>

<script>
// ── Helpers ───────────────────────────────────────────────────────────────────

async function _extractError(resp) {
  try {
    const data = await resp.clone().json();
    return data.detail || data.message || resp.statusText;
  } catch {
    try {
      const txt = await resp.text();
      return txt.slice(0, 200).replace(/<[^>]+>/g, '').trim() || resp.statusText;
    } catch {
      return `HTTP ${resp.status}`;
    }
  }
}

// ── State ─────────────────────────────────────────────────────────────────────

let modelsReady   = false;
let isTranslating = false;
let mediaRecorder = null;
let recordingChunks = [];
let isRecording   = false;

// ── DOM refs ──────────────────────────────────────────────────────────────────

const inputText    = document.getElementById('inputText');
const charCount    = document.getElementById('charCount');
const translateBtn = document.getElementById('translateBtn');
const clearBtn     = document.getElementById('clearBtn');
const micBtn       = document.getElementById('micBtn');
const micStatus    = document.getElementById('micStatus');
const hindiText    = document.getElementById('hindiText');
const audioCard    = document.getElementById('audioCard');
const audioPlayer  = document.getElementById('audioPlayer');
const errorBox     = document.getElementById('errorBox');
const statsBar     = document.getElementById('statsBar');
const statusDot    = document.getElementById('statusDot');
const statusText   = document.getElementById('statusText');

// ── Status polling ────────────────────────────────────────────────────────────

async function checkStatus() {
  try {
    const r = await fetch('/api/status');
    const data = await r.json();
    modelsReady = data.ready;

    if (data.ready) {
      statusDot.className = 'status-dot ready';
      statusText.textContent = 'Ready — NLLB-200';
    } else {
      statusDot.className = 'status-dot';
      statusText.textContent = 'Loading models…';
      setTimeout(checkStatus, 2000);
    }
  } catch {
    statusDot.className = 'status-dot error';
    statusText.textContent = 'Server unavailable';
    setTimeout(checkStatus, 3000);
  }
}

// ── UI helpers ────────────────────────────────────────────────────────────────

function showError(msg) {
  errorBox.textContent = `Error: ${msg}`;
  errorBox.style.display = 'block';
}

function clearError() {
  errorBox.style.display = 'none';
  errorBox.textContent = '';
}

// ── Translation ───────────────────────────────────────────────────────────────

async function runTranslation(text) {
  if (!modelsReady) { showError('Models are still loading, please wait…'); return; }
  if (!text.trim()) { showError('Please enter some English text first.'); return; }
  if (isTranslating) return;

  isTranslating = true;
  clearError();
  hindiText.innerHTML = '<span class="hindi-placeholder">Translating…</span>';
  audioCard.style.display = 'none';
  statsBar.style.display = 'none';
  translateBtn.disabled = true;

  try {
    const resp = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, backend: 'nllb', tone: 'auto' }),
    });

    if (!resp.ok) throw new Error(await _extractError(resp));

    const d = await resp.json();

    // Hindi output
    hindiText.textContent = d.hindi;

    // Audio playback
    const wavBlob = b64ToBlob(d.audio_b64, 'audio/wav');
    audioPlayer.src = URL.createObjectURL(wavBlob);
    audioCard.style.display = 'block';
    audioPlayer.play().catch(() => {});

    // Stats
    document.getElementById('statTrans').textContent = `${d.trans_ms} ms`;
    document.getElementById('statTts').textContent   = `${d.tts_ms} ms`;
    document.getElementById('statTotal').textContent = `${d.total_ms} ms`;
    statsBar.style.display = 'flex';

  } catch (err) {
    showError(err.message || String(err));
    hindiText.innerHTML = '<span class="hindi-placeholder">Translation failed.</span>';
  } finally {
    isTranslating = false;
    translateBtn.disabled = false;
  }
}

function b64ToBlob(b64, mime) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

// ── Microphone recording ──────────────────────────────────────────────────────

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordingChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordingChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recordingChunks, { type: 'audio/webm' });
      await transcribeAndFill(blob);
    };
    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
    micStatus.textContent = 'Recording…';
  } catch (err) {
    showError(`Microphone: ${err.message}`);
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  isRecording = false;
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎤';
  micStatus.textContent = 'Transcribing…';
}

async function transcribeAndFill(audioBlob) {
  try {
    const form = new FormData();
    form.append('file', audioBlob, 'recording.webm');
    const resp = await fetch('/api/asr', { method: 'POST', body: form });
    if (!resp.ok) throw new Error(await _extractError(resp));
    const { english } = await resp.json();
    if (english.trim()) {
      inputText.value = english;
      updateCharCount();
      micStatus.textContent = `Transcribed: "${english}"`;
      await runTranslation(english);
    } else {
      micStatus.textContent = 'Could not transcribe audio.';
    }
  } catch (err) {
    micStatus.textContent = '';
    showError(`ASR: ${err.message}`);
  }
}

// ── Event listeners ───────────────────────────────────────────────────────────

micBtn.addEventListener('click', () => {
  if (isRecording) stopRecording();
  else startRecording();
});

translateBtn.addEventListener('click', () => runTranslation(inputText.value));

clearBtn.addEventListener('click', () => {
  inputText.value = '';
  updateCharCount();
  hindiText.innerHTML = '<span class="hindi-placeholder">Translation will appear here…</span>';
  audioCard.style.display = 'none';
  statsBar.style.display = 'none';
  clearError();
  micStatus.textContent = '';
});

inputText.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runTranslation(inputText.value);
});

inputText.addEventListener('input', updateCharCount);

function updateCharCount() {
  charCount.textContent = inputText.value.length;
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────

checkStatus();
</script>
</body>
</html>
